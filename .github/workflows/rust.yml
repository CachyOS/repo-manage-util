name: Build

on:
  push:
    paths-ignore:
      - 'LICENSE'
      - '*.md'
      - '*.sh'
    branches:
      - develop
  pull_request:
    branches:
      - develop

env:
  CARGO_TERM_COLOR: always
  DATABASE_URL: "postgresql://postgres:password@localhost:15432/testdb"

jobs:
  build:
    name: CI
    runs-on: ubuntu-latest
    container:
      image: archlinux

    # Service containers to run with current job
    services:
      test-postgres:
        image: postgres:17.0-alpine
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 15432:5432

    steps:
      - name: Install Packages
        run: pacman -Syu clang gcc pkg-config --noconfirm --needed

      - uses: actions/checkout@v4

      - name: Setup toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: nightly
          override: true
          components: rustfmt, clippy

      - name: Run cargo build
        uses: actions-rs/cargo@v1
        with:
          command: build

      - name: Run cargo test
        uses: actions-rs/cargo@v1
        with:
          command: test

      - name: Run cargo test on pg_impl
        uses: actions-rs/cargo@v1
        with:
          command: test --manifest-path pg_impl/Cargo.toml

      - name: Run cargo clippy
        uses: actions-rs/cargo@v1
        with:
          command: clippy
          args: --all-targets -- -D warnings

      - name: Run cargo fmt
        uses: actions-rs/cargo@v1
        with:
          command: fmt
          args: --all -- --check
