global:
  scrape_interval:     15s
  evaluation_interval: 15s

rule_files:
# - "first_rules.yml"
# - "second_rules.yml"

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['127.0.0.1:9090']

  - job_name: userver
    metrics_path: '/metrics'
    scrape_interval: 5s
    static_configs:
      - targets: ['api-postgresql-service:8086']
