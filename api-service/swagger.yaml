openapi: 3.0.3
info:
  title: repo-manage-util API
  description: |-
    A RESTful API to query package information from repositories managed by `repo-manage-util`.
    This API provides endpoints to search for packages and retrieve detailed information about a specific package.
  version: 1.0.0
servers:
  - url: http://localhost:5862/api/v1
paths:
  /packages-search:
    get:
      summary: Search for packages
      description: |-
        Searches for packages across all repositories based on a query string.
        Supports pagination and filtering by repository and architecture.
      parameters:
        - name: search
          in: query
          description: The search term to find packages by name or description.
          required: false
          schema:
            type: string
        - name: repo
          in: query
          description: A comma-separated list of repository names to filter by.
          required: false
          schema:
            type: string
            example: "my-repo-1,my-repo-2"
        - name: arch
          in: query
          description: A comma-separated list of architectures to filter by.
          required: false
          schema:
            type: string
            example: "x86_64,aarch64"
        - name: current_page
          in: query
          description: The page number to retrieve.
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: page_size
          in: query
          description: The number of packages to return per page.
          required: false
          schema:
            type: integer
            default: 100
            minimum: 1
      responses:
        "200":
          description: A successful response containing a list of packages.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackageSearchResponse"
        "400":
          description: Invalid input for `current_page` or `page_size`.
  /packages/suggest/{query}:
    get:
      summary: Suggest packages
      description: Provides search suggestions for packages.
      parameters:
        - name: query
          in: path
          description: The search query prefix.
          required: true
          schema:
            type: string
        - name: limit
          in: query
          description: Limit the number of suggestions.
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: A successful response containing suggestions.
          content:
            application/x-suggestions+json:
              schema:
                type: array
                items:
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
  /package/{repo}/{arch}/{pkgname}:
    get:
      summary: Get package details
      description: Retrieves detailed information for a specific package within a given repository and architecture.
      parameters:
        - name: repo
          in: path
          description: The name of the repository.
          required: true
          schema:
            type: string
            example: "my-stable-repo"
        - name: arch
          in: path
          description: The architecture of the package.
          required: true
          schema:
            type: string
            example: "x86_64"
        - name: pkgname
          in: path
          description: The name of the package.
          required: true
          schema:
            type: string
            example: "openssl"
      responses:
        "200":
          description: A successful response containing the package details.
          content:
            application/json:
              schema:
                type: object
                properties:
                  package:
                    $ref: "#/components/schemas/PackageDetails"
        "404":
          description: The requested package was not found.
  /package/{repo}/{arch}/{pkgname}/files:
    get:
      summary: Get package file list
      description: Retrieves the list of files for a specific package.
      parameters:
        - name: repo
          in: path
          description: The name of the repository.
          required: true
          schema:
            type: string
            example: "my-stable-repo"
        - name: arch
          in: path
          description: The architecture of the package.
          required: true
          schema:
            type: string
            example: "x86_64"
        - name: pkgname
          in: path
          description: The name of the package.
          required: true
          schema:
            type: string
            example: "openssl"
      responses:
        "200":
          description: A successful response containing the file list.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        "404":
          description: The requested package was not found.
  /split/{repo}/{pkgbase}:
    get:
      summary: Get split packages for a package base
      description: |
        Retrieves all split packages for a given repository and package base.
        Returns brief information for each split package (e.g., libvlc, vlc-cli, etc.).
      parameters:
        - name: repo
          in: path
          description: The name of the repository.
          required: true
          schema:
            type: string
          example: "my-stable-repo"
        - name: pkgbase
          in: path
          description: The package base name.
          required: true
          schema:
            type: string
          example: "vlc"
      responses:
        "200":
          description: A successful response containing the split packages.
          content:
            application/json:
              schema:
                type: object
                properties:
                  split_packages:
                    type: array
                    items:
                      $ref: "#/components/schemas/BriefPackage"
        "404":
          description: The requested package base was not found.
  /mirrors:
    get:
      summary: Get mirror metadata
      description: |
        Returns mirror metadata in an Arch mirrorlist compatible shape so clients
        can rank mirrors by locality, speed, and freshness.
      responses:
        "200":
          description: Mirror metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MirrorsResponse"

components:
  schemas:
    PackageSearchResponse:
      type: object
      properties:
        total_packages:
          type: integer
          format: int64
          description: The total number of packages matching the search criteria.
        total_pages:
          type: integer
          format: int64
          description: The total number of pages available.
        packages:
          type: array
          items:
            $ref: "#/components/schemas/BriefPackage"
    BriefPackage:
      type: object
      properties:
        pkg_name:
          type: string
          description: The name of the package.
        repo_name:
          type: string
          description: The name of the repository the package belongs to.
        pkg_arch:
          type: string
          description: The architecture of the package.
        pkg_version:
          type: string
          description: The version of the package.
        pkg_desc:
          type: string
          description: A brief description of the package.
        pkg_builddate:
          type: integer
          format: int64
          description: The timestamp (Unix epoch) when the package was last updated.
    PackageDetails:
      type: object
      properties:
        repo_name:
          type: string
        pkg_name:
          type: string
        pkg_version:
          type: string
        pkg_base:
          type: string
          nullable: true
        pkg_desc:
          type: string
          nullable: true
        pkg_groups:
          type: array
          items:
            type: string
          nullable: true
        pkg_url:
          type: string
          nullable: true
        pkg_license:
          type: array
          items:
            type: string
          nullable: true
        pkg_arch:
          type: string
          nullable: true
        pkg_builddate:
          type: integer
          format: int64
          nullable: true
        pkg_packager:
          type: string
          nullable: true
        pkg_csize:
          type: integer
          format: int64
          nullable: true
        pkg_isize:
          type: integer
          format: int64
          nullable: true
        pkg_sha256sum:
          type: string
          nullable: true
        pkg_pgpsig:
          type: string
          nullable: true
        pkg_replaces:
          type: array
          items:
            type: string
          nullable: true
        pkg_depends:
          type: array
          items:
            type: string
          nullable: true
        pkg_optdepends:
          type: array
          items:
            type: string
          nullable: true
        pkg_makedepends:
          type: array
          items:
            type: string
          nullable: true
        pkg_checkdepends:
          type: array
          items:
            type: string
          nullable: true
        pkg_conflicts:
          type: array
          items:
            type: string
          nullable: true
        pkg_provides:
          type: array
          items:
            type: string
          nullable: true
        pkg_files:
          type: array
          items:
            type: string
          nullable: true
        updated:
          type: integer
          format: int64
    Mirror:
      type: object
      properties:
        country_code:
          type: string
          description: Country code from mirrorlist metadata.
        url:
          type: string
          description: Base mirror URL without the /repo/$arch/$repo suffix.
        out_of_date:
          type: boolean
          description: Whether the mirror is stale or missing tracked repo data.
        last_sync:
          type: string
          format: date-time
          nullable: true
          description: Newest successful tracked repo sync represented as UTC.
        tier:
          type: integer
          enum: [1, 2]
          description: Tier 1 mirrors pull directly from upstream, tier 2 mirrors do not.
        overall_status:
          type: string
          enum: [healthy, partial, out-of-sync, error]
          description: >-
            Aggregate sync health across all tracked repos: healthy (all synced),
            partial (some synced), out-of-sync (none synced but reachable), error
            (no reachable repo data).
        average_lag_seconds:
          type: integer
          format: int64
          nullable: true
          description: >-
            Mean per-repo sync lag in seconds behind the primary build server,
            across every repo with a baseline to compare against (0 when fully in
            sync). Null when no tracked repo has a baseline.
        delay_seconds:
          type: integer
          format: int64
          nullable: true
          description: >-
            Maximum per-repo sync lag in seconds (worst-case staleness versus the
            primary build server), suitable for delay thresholds. 0 when fully in
            sync. Null when no tracked repo has a baseline.
        checks:
          type: array
          description: Per-repo freshness breakdown against the primary build server.
          items:
            $ref: "#/components/schemas/RepoCheck"
      required: [country_code, url, out_of_date, last_sync, tier, overall_status, checks]
    RepoCheck:
      type: object
      properties:
        path:
          type: string
          description: Repo path probed on the mirror (e.g. x86_64/cachyos).
        status:
          type: string
          enum: [synced, out-of-sync, error]
          description: Per-repo sync status; error means the lastupdate probe failed.
        last_updated:
          type: string
          format: date-time
          nullable: true
          description: Repo lastupdate timestamp on the mirror as UTC, null on error.
        sync_lag_seconds:
          type: integer
          format: int64
          nullable: true
          description: >-
            Seconds this repo is behind the primary build server (may be
            negative if ahead). Null when there is no baseline or on error.
      required: [path, status, last_updated, sync_lag_seconds]
    MirrorsResponse:
      type: object
      properties:
        mirrors:
          type: array
          items:
            $ref: "#/components/schemas/Mirror"
      required: [mirrors]
